<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta-Agent Dashboard - LumenBridge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 2.5rem;
    }

    .subtitle {
      color: #666;
      font-size: 1.1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .create-section {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .create-section h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      min-height: 100px;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .options {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .agents-section {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .agents-section h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .agent-card {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      cursor: pointer;
    }

    .agent-card:hover {
      transform: translateY(-5px);
    }

    .agent-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    .agent-purpose {
      color: #555;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .agent-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
      color: #666;
    }

    .agent-meta-row {
      display: flex;
      justify-content: space-between;
    }

    .agent-meta strong {
      color: #333;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: #667eea;
      color: white;
    }

    .alert {
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .alert.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }

    .alert.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }

    .alert.info {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 1.2rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: white;
      max-width: 900px;
      margin: 40px auto;
      padding: 40px;
      border-radius: 15px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 2rem;
      cursor: pointer;
      color: #999;
    }

    .modal-close:hover {
      color: #333;
    }

    .modal h3 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .modal-section {
      margin-bottom: 25px;
    }

    .modal-section h4 {
      color: #333;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .io-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .io-item {
      background: #667eea;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to Home</a>

    <header>
      <h1>🏗️ Meta-Agent Dashboard</h1>
      <p class="subtitle">Create AI agents on-demand • The Agent Factory</p>
    </header>

    <div id="alertContainer"></div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalAgents">0</div>
        <div class="stat-label">Total Agents Created</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="myAgents">0</div>
        <div class="stat-label">My Agents</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="requestCost">10</div>
        <div class="stat-label">Requests Per Creation</div>
      </div>
    </div>

    <div class="create-section">
      <h2>Create New Agent</h2>
      <form id="createAgentForm">
        <div class="form-group">
          <label for="agentPrompt">Describe what agent you need:</label>
          <textarea 
            id="agentPrompt" 
            name="prompt" 
            placeholder="Example: I need an agent that analyzes PDF contracts and identifies liability clauses with risk scores"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label>Options:</label>
          <div class="options">
            <div class="checkbox-group">
              <input type="checkbox" id="withInfrastructure" name="withInfrastructure">
              <label for="withInfrastructure" style="margin: 0;">Generate Dockerfile & deployment config</label>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="autoTest" name="autoTest" checked>
              <label for="autoTest" style="margin: 0;">Auto-test the agent</label>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="returnCode" name="returnCode" checked>
              <label for="returnCode" style="margin: 0;">Return generated code</label>
            </div>
          </div>
        </div>

        <button type="submit" id="createBtn">Create Agent</button>
      </form>
    </div>

    <div class="agents-section">
      <h2>Generated Agents</h2>
      <div id="agentsContainer" class="loading">Loading agents...</div>
    </div>
  </div>

  <!-- Agent Details Modal -->
  <div id="agentModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let currentUserEmail = null;

    // Check if user is logged in
    window.addEventListener('load', () => {
      currentUserEmail = sessionStorage.getItem('userEmail');
      loadAgents();
    });

    // Show alert
    function showAlert(message, type = 'info') {
      const alertContainer = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert ${type}`;
      alert.textContent = message;
      alert.style.display = 'block';
      alertContainer.appendChild(alert);

      setTimeout(() => {
        alert.remove();
      }, 5000);
    }

    // Load agents
    async function loadAgents() {
      try {
        const response = await fetch(`${API_BASE}/api/meta/agents?limit=50`);
        const data = await response.json();

        if (data.success) {
          document.getElementById('totalAgents').textContent = data.total;
          
          const myAgentsCount = currentUserEmail 
            ? data.agents.filter(a => a.createdBy === currentUserEmail).length
            : 0;
          document.getElementById('myAgents').textContent = myAgentsCount;

          displayAgents(data.agents);
        } else {
          document.getElementById('agentsContainer').innerHTML = '<p>Error loading agents</p>';
        }
      } catch (error) {
        console.error('Failed to load agents:', error);
        document.getElementById('agentsContainer').innerHTML = '<p>Error loading agents</p>';
      }
    }

    // Display agents
    function displayAgents(agents) {
      const container = document.getElementById('agentsContainer');
      
      if (agents.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #999;">No agents created yet. Be the first!</p>';
        return;
      }

      container.innerHTML = '';
      container.className = 'agents-grid';

      agents.forEach(agent => {
        const card = document.createElement('div');
        card.className = 'agent-card';
        card.onclick = () => showAgentDetails(agent._id);

        const isMyAgent = currentUserEmail && agent.createdBy === currentUserEmail;

        card.innerHTML = `
          <div class="agent-name">${agent.name}</div>
          <div class="agent-purpose">${agent.purpose}</div>
          <div class="agent-meta">
            <div class="agent-meta-row">
              <span><strong>Inputs:</strong> ${agent.inputs.length}</span>
              <span><strong>Outputs:</strong> ${agent.outputs.length}</span>
            </div>
            <div class="agent-meta-row">
              <span><strong>Created:</strong> ${new Date(agent.createdAt).toLocaleDateString()}</span>
              ${isMyAgent ? '<span class="badge">Mine</span>' : ''}
            </div>
            <div style="margin-top: 10px;">
              <strong>Public Key:</strong><br>
              <code style="font-size: 0.75rem; word-break: break-all;">${agent.publicKey.substring(0, 40)}...</code>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Show agent details
    async function showAgentDetails(agentId) {
      try {
        const response = await fetch(`${API_BASE}/api/meta/agents/${agentId}`);
        const data = await response.json();

        if (data.success) {
          const agent = data.agent;
          const modalContent = document.getElementById('modalContent');

          modalContent.innerHTML = `
            <h3>${agent.name}</h3>
            
            <div class="modal-section">
              <h4>Purpose</h4>
              <p>${agent.purpose}</p>
            </div>

            <div class="modal-section">
              <h4>Original Prompt</h4>
              <p><em>"${agent.prompt}"</em></p>
            </div>

            <div class="modal-section">
              <h4>Inputs</h4>
              <div class="io-list">
                ${agent.inputs.map(i => `<span class="io-item">${i}</span>`).join('')}
              </div>
            </div>

            <div class="modal-section">
              <h4>Outputs</h4>
              <div class="io-list">
                ${agent.outputs.map(o => `<span class="io-item">${o}</span>`).join('')}
              </div>
            </div>

            <div class="modal-section">
              <h4>Identity</h4>
              <p><strong>Public Key:</strong><br><code>${agent.publicKey}</code></p>
              <p><strong>Address:</strong><br><code>${agent.address}</code></p>
            </div>

            ${agent.code ? `
              <div class="modal-section">
                <h4>Generated Code</h4>
                <pre>${escapeHtml(agent.code.substring(0, 1000))}${agent.code.length > 1000 ? '\n\n... (truncated)' : ''}</pre>
              </div>
            ` : ''}

            ${agent.testResult ? `
              <div class="modal-section">
                <h4>Test Result</h4>
                <pre>${JSON.stringify(agent.testResult, null, 2)}</pre>
              </div>
            ` : ''}

            <div class="modal-section">
              <h4>Metadata</h4>
              <p><strong>Created By:</strong> ${agent.createdBy}</p>
              <p><strong>Created At:</strong> ${new Date(agent.createdAt).toLocaleString()}</p>
              <p><strong>Signature:</strong><br><code style="word-break: break-all;">${agent.signature.substring(0, 100)}...</code></p>
            </div>
          `;

          document.getElementById('agentModal').style.display = 'block';
        }
      } catch (error) {
        console.error('Failed to load agent details:', error);
        showAlert('Failed to load agent details', 'error');
      }
    }

    function closeModal() {
      document.getElementById('agentModal').style.display = 'none';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Create agent
    document.getElementById('createAgentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const createBtn = document.getElementById('createBtn');
      const originalText = createBtn.textContent;

      try {
        createBtn.disabled = true;
        createBtn.textContent = 'Creating Agent...';

        const formData = new FormData(e.target);
        const prompt = formData.get('prompt');
        const options = {
          withInfrastructure: document.getElementById('withInfrastructure').checked,
          autoTest: document.getElementById('autoTest').checked,
          returnCode: document.getElementById('returnCode').checked
        };

        const response = await fetch(`${API_BASE}/api/meta/create-agent`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt, options })
        });

        const data = await response.json();

        if (data.success) {
          showAlert(`✅ Successfully created ${data.agentSpec.name}!`, 'success');
          document.getElementById('agentPrompt').value = '';
          
          // Reload agents
          setTimeout(() => {
            loadAgents();
          }, 1000);
        } else {
          showAlert(`❌ Error: ${data.error}`, 'error');
        }
      } catch (error) {
        console.error('Failed to create agent:', error);
        showAlert('Failed to create agent. Please try again.', 'error');
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = originalText;
      }
    });

    // Close modal on outside click
    window.onclick = function(event) {
      const modal = document.getElementById('agentModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    };
  </script>
</body>
</html>
