<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta-Agent Dashboard - LumenBridge</title>
  <style>
    :root {
      --bg-1: #050816;
      --bg-2: #0b1020;
      --accent: #667eea;
      --accent-soft: #818cf8;
      --accent-strong: #a855f7;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(148, 163, 184, 0.35);
      --glow: 0 0 30px rgba(129, 140, 248, 0.35);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: var(--text-main);
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.18) 0, transparent 55%),
        radial-gradient(circle at 90% 10%, rgba(244, 114, 182, 0.18) 0, transparent 55%),
        radial-gradient(circle at 10% 90%, rgba(129, 140, 248, 0.22) 0, transparent 55%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, #020617 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      animation: bgShift 18s ease-in-out infinite alternate;
      padding: 20px;
    }

    @keyframes bgShift {
      0% {
        background-position: 0% 0%, 100% 0%, 0% 100%, 0% 50%;
      }
      100% {
        background-position: 10% 10%, 90% 5%, 15% 80%, 100% 50%;
      }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: radial-gradient(circle at top left, rgba(129, 140, 248, 0.18), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.15), transparent 55%),
                  linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.98));
      padding: 40px 30px;
      border-radius: var(--radius-lg);
      box-shadow:
        0 35px 120px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(148, 163, 184, 0.45);
      margin-bottom: 30px;
      backdrop-filter: blur(22px);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: "";
      position: absolute;
      inset: -60%;
      background-image: radial-gradient(circle at 10% 20%, rgba(129, 140, 248, 0.12) 0, transparent 55%);
      opacity: 0.8;
      pointer-events: none;
    }

    header > * {
      position: relative;
      z-index: 1;
    }

    h1 {
      color: var(--text-main);
      margin-bottom: 10px;
      font-size: 2.5rem;
      text-shadow: 0 15px 40px rgba(15, 23, 42, 0.9);
      letter-spacing: 0.04em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: radial-gradient(circle at top left, rgba(129, 140, 248, 0.2), transparent 65%),
                  rgba(15, 23, 42, 0.96);
      padding: 25px;
      border-radius: var(--radius-md);
      box-shadow:
        0 18px 40px rgba(15, 23, 42, 0.8),
        0 0 0 1px rgba(148, 163, 184, 0.4);
      position: relative;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 100% 0%, rgba(236, 72, 153, 0.22) 0, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow:
        0 22px 60px rgba(15, 23, 42, 0.95),
        0 0 45px rgba(129, 140, 248, 0.45);
    }

    .stat-card:hover::after {
      opacity: 1;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: bold;
      background: linear-gradient(130deg, #e5e7eb, #a5b4fc, #f9a8d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 5px;
      display: block;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .create-section {
      background: radial-gradient(circle at top left, rgba(129, 140, 248, 0.18), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.15), transparent 55%),
                  linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.98));
      padding: 30px;
      border-radius: var(--radius-lg);
      box-shadow:
        0 35px 120px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(148, 163, 184, 0.45);
      margin-bottom: 30px;
      backdrop-filter: blur(22px);
      position: relative;
      overflow: hidden;
    }

    .create-section::before {
      content: "";
      position: absolute;
      inset: -60%;
      background-image: radial-gradient(circle at 10% 20%, rgba(129, 140, 248, 0.12) 0, transparent 55%);
      opacity: 0.8;
      pointer-events: none;
    }

    .create-section > * {
      position: relative;
      z-index: 1;
    }

    .create-section h2 {
      color: var(--text-main);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-main);
      font-weight: 500;
    }

    textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid rgba(148, 163, 184, 0.4);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      min-height: 100px;
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-main);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-soft);
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
    }

    .options {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    button {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
    }

    button:hover::before {
      opacity: 1;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    button:disabled:hover {
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
    }

    .agents-section {
      background: radial-gradient(circle at top left, rgba(129, 140, 248, 0.18), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.15), transparent 55%),
                  linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.98));
      padding: 30px;
      border-radius: var(--radius-lg);
      box-shadow:
        0 35px 120px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(148, 163, 184, 0.45);
      backdrop-filter: blur(22px);
      position: relative;
      overflow: hidden;
    }

    .agents-section::before {
      content: "";
      position: absolute;
      inset: -60%;
      background-image: radial-gradient(circle at 10% 20%, rgba(129, 140, 248, 0.12) 0, transparent 55%);
      opacity: 0.8;
      pointer-events: none;
    }

    .agents-section > * {
      position: relative;
      z-index: 1;
    }

    .agents-section h2 {
      color: var(--text-main);
      margin-bottom: 20px;
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .agent-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(30, 64, 175, 0.94));
      padding: 25px;
      border-radius: var(--radius-md);
      box-shadow:
        0 16px 45px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(148, 163, 184, 0.45);
      transition: transform 0.26s ease, box-shadow 0.26s ease, background 0.26s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .agent-card::before {
      content: "";
      position: absolute;
      width: 130%;
      height: 130%;
      top: -70%;
      left: -10%;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.35) 0, transparent 50%);
      opacity: 0;
      transition: opacity 0.26s ease, transform 0.26s ease;
    }

    .agent-card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 24px 70px rgba(15, 23, 42, 0.95),
        0 0 55px rgba(129, 140, 248, 0.55);
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.96), rgba(76, 29, 149, 0.96));
    }

    .agent-card:hover::before {
      opacity: 1;
      transform: translate3d(5px, 10px, 0);
    }

    .agent-card > * {
      position: relative;
      z-index: 1;
    }

    .agent-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .agent-purpose {
      color: var(--text-muted);
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .agent-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .agent-meta-row {
      display: flex;
      justify-content: space-between;
    }

    .agent-meta strong {
      color: var(--text-main);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .alert {
      padding: 15px 20px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      display: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.5);
    }

    .alert.success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert.info {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--accent-soft);
      font-size: 1.2rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 22, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: radial-gradient(circle at top left, rgba(129, 140, 248, 0.18), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.15), transparent 55%),
                  linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.99));
      max-width: 900px;
      margin: 40px auto;
      padding: 40px;
      border-radius: var(--radius-lg);
      position: relative;
      box-shadow:
        0 35px 120px rgba(15, 23, 42, 0.95),
        0 0 0 1px rgba(148, 163, 184, 0.45);
      backdrop-filter: blur(22px);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 2rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    .modal-close:hover {
      color: var(--text-main);
    }

    .modal h3 {
      color: var(--accent-soft);
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .modal-section {
      margin-bottom: 25px;
    }

    .modal-section h4 {
      color: var(--text-main);
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .modal-section p {
      color: var(--text-muted);
    }

    pre {
      background: rgba(15, 23, 42, 0.8);
      padding: 15px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      font-size: 0.9rem;
      line-height: 1.5;
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: var(--text-main);
    }

    .io-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .io-item {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.3);
      transition: all 0.2s ease;
    }

    .back-link:hover {
      background: rgba(15, 23, 42, 0.8);
      border-color: var(--accent-soft);
      box-shadow: 0 4px 12px rgba(129, 140, 248, 0.3);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">← Back to Home</a>

    <header>
      <h1>🏗️ Meta-Agent Dashboard</h1>
      <p class="subtitle">Create AI agents on-demand • The Agent Factory</p>
    </header>

    <div id="alertContainer"></div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalAgents">0</div>
        <div class="stat-label">Total Agents Created</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="myAgents">0</div>
        <div class="stat-label">My Agents</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="requestCost">10</div>
        <div class="stat-label">Requests Per Creation</div>
      </div>
    </div>

    <div class="create-section">
      <h2>Create New Agent</h2>
      <form id="createAgentForm">
        <div class="form-group">
          <label for="agentPrompt">Describe what agent you need:</label>
          <textarea 
            id="agentPrompt" 
            name="prompt" 
            placeholder="Example: I need an agent that analyzes PDF contracts and identifies liability clauses with risk scores"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label>Options:</label>
          <div class="options">
            <div class="checkbox-group">
              <input type="checkbox" id="withInfrastructure" name="withInfrastructure">
              <label for="withInfrastructure" style="margin: 0;">Generate Dockerfile & deployment config</label>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="autoTest" name="autoTest" checked>
              <label for="autoTest" style="margin: 0;">Auto-test the agent</label>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="returnCode" name="returnCode" checked>
              <label for="returnCode" style="margin: 0;">Return generated code</label>
            </div>
          </div>
        </div>

        <button type="submit" id="createBtn">Create Agent</button>
      </form>
    </div>

    <div class="agents-section">
      <h2>Generated Agents</h2>
      <div id="agentsContainer" class="loading">Loading agents...</div>
    </div>
  </div>

  <!-- Agent Details Modal -->
  <div id="agentModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeModal()">&times;</span>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let currentUserEmail = null;

    // Check if user is logged in
    window.addEventListener('load', () => {
      currentUserEmail = sessionStorage.getItem('userEmail');
      loadAgents();
    });

    // Show alert
    function showAlert(message, type = 'info') {
      const alertContainer = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert ${type}`;
      alert.textContent = message;
      alert.style.display = 'block';
      alertContainer.appendChild(alert);

      setTimeout(() => {
        alert.remove();
      }, 5000);
    }

    // Load agents
    async function loadAgents() {
      try {
        const response = await fetch(`${API_BASE}/api/meta/agents?limit=50`);
        const data = await response.json();

        if (data.success) {
          document.getElementById('totalAgents').textContent = data.total;
          
          const myAgentsCount = currentUserEmail 
            ? data.agents.filter(a => a.createdBy === currentUserEmail).length
            : 0;
          document.getElementById('myAgents').textContent = myAgentsCount;

          displayAgents(data.agents);
        } else {
          document.getElementById('agentsContainer').innerHTML = '<p>Error loading agents</p>';
        }
      } catch (error) {
        console.error('Failed to load agents:', error);
        document.getElementById('agentsContainer').innerHTML = '<p>Error loading agents</p>';
      }
    }

    // Display agents
    function displayAgents(agents) {
      const container = document.getElementById('agentsContainer');
      
      if (agents.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #999;">No agents created yet. Be the first!</p>';
        return;
      }

      container.innerHTML = '';
      container.className = 'agents-grid';

      agents.forEach(agent => {
        const card = document.createElement('div');
        card.className = 'agent-card';
        card.onclick = () => showAgentDetails(agent._id);

        const isMyAgent = currentUserEmail && agent.createdBy === currentUserEmail;

        card.innerHTML = `
          <div class="agent-name">${agent.name}</div>
          <div class="agent-purpose">${agent.purpose}</div>
          <div class="agent-meta">
            <div class="agent-meta-row">
              <span><strong>Inputs:</strong> ${agent.inputs.length}</span>
              <span><strong>Outputs:</strong> ${agent.outputs.length}</span>
            </div>
            <div class="agent-meta-row">
              <span><strong>Created:</strong> ${new Date(agent.createdAt).toLocaleDateString()}</span>
              ${isMyAgent ? '<span class="badge">Mine</span>' : ''}
            </div>
            <div style="margin-top: 10px;">
              <strong>Public Key:</strong><br>
              <code style="font-size: 0.75rem; word-break: break-all;">${agent.publicKey.substring(0, 40)}...</code>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Show agent details
    async function showAgentDetails(agentId) {
      try {
        const response = await fetch(`${API_BASE}/api/meta/agents/${agentId}`);
        const data = await response.json();

        if (data.success) {
          const agent = data.agent;
          const modalContent = document.getElementById('modalContent');

          modalContent.innerHTML = `
            <h3>${agent.name}</h3>
            
            <div class="modal-section">
              <h4>Purpose</h4>
              <p>${agent.purpose}</p>
            </div>

            <div class="modal-section">
              <h4>Original Prompt</h4>
              <p><em>"${agent.prompt}"</em></p>
            </div>

            <div class="modal-section">
              <h4>Inputs</h4>
              <div class="io-list">
                ${agent.inputs.map(i => `<span class="io-item">${i}</span>`).join('')}
              </div>
            </div>

            <div class="modal-section">
              <h4>Outputs</h4>
              <div class="io-list">
                ${agent.outputs.map(o => `<span class="io-item">${o}</span>`).join('')}
              </div>
            </div>

            <div class="modal-section">
              <h4>Identity</h4>
              <p><strong>Public Key:</strong><br><code>${agent.publicKey}</code></p>
              <p><strong>Address:</strong><br><code>${agent.address}</code></p>
            </div>

            ${agent.code ? `
              <div class="modal-section">
                <h4>Generated Code</h4>
                <pre>${escapeHtml(agent.code.substring(0, 1000))}${agent.code.length > 1000 ? '\n\n... (truncated)' : ''}</pre>
              </div>
            ` : ''}

            ${agent.testResult ? `
              <div class="modal-section">
                <h4>Test Result</h4>
                <pre>${JSON.stringify(agent.testResult, null, 2)}</pre>
              </div>
            ` : ''}

            <div class="modal-section">
              <h4>Metadata</h4>
              <p><strong>Created By:</strong> ${agent.createdBy}</p>
              <p><strong>Created At:</strong> ${new Date(agent.createdAt).toLocaleString()}</p>
              <p><strong>Signature:</strong><br><code style="word-break: break-all;">${agent.signature.substring(0, 100)}...</code></p>
            </div>
          `;

          document.getElementById('agentModal').style.display = 'block';
        }
      } catch (error) {
        console.error('Failed to load agent details:', error);
        showAlert('Failed to load agent details', 'error');
      }
    }

    function closeModal() {
      document.getElementById('agentModal').style.display = 'none';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Create agent
    document.getElementById('createAgentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const createBtn = document.getElementById('createBtn');
      const originalText = createBtn.textContent;

      try {
        createBtn.disabled = true;
        createBtn.textContent = 'Creating Agent...';

        const formData = new FormData(e.target);
        const prompt = formData.get('prompt');
        const options = {
          withInfrastructure: document.getElementById('withInfrastructure').checked,
          autoTest: document.getElementById('autoTest').checked,
          returnCode: document.getElementById('returnCode').checked
        };

        const response = await fetch(`${API_BASE}/api/meta/create-agent`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt, options })
        });

        const data = await response.json();

        if (data.success) {
          showAlert(`✅ Successfully created ${data.agentSpec.name}!`, 'success');
          document.getElementById('agentPrompt').value = '';
          
          // Reload agents
          setTimeout(() => {
            loadAgents();
          }, 1000);
        } else {
          showAlert(`❌ Error: ${data.error}`, 'error');
        }
      } catch (error) {
        console.error('Failed to create agent:', error);
        showAlert('Failed to create agent. Please try again.', 'error');
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = originalText;
      }
    });

    // Close modal on outside click
    window.onclick = function(event) {
      const modal = document.getElementById('agentModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    };
  </script>
</body>
</html>
